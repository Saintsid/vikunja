name: Build image (days-grouping)

on:
  push:
    branches:
      - days-grouping
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # build-push-action fetches the git context of this commit with GITHUB_TOKEN
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The xgo builder image alone is several GB
      - name: Free disk space
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          large-packages: false
          docker-images: false
          swap-storage: false

      # GHCR only accepts lowercase image names
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vikunja" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: 2.7.0-days and sha-<7 chars>, never latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=2.7.0-days
            type=sha

      # Without `context` the action builds the git context of this commit, like the official
      # release images. RELEASE_VERSION must be set: without it mage runs `git describe`, which
      # fails without .git. "+days" is build metadata, so dumps stay compatible with v2.7.0.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=v2.7.0+days
